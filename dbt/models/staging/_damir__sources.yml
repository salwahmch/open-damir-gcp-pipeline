version: 2

sources:
  - name: damir_raw
    description: >
      Zone brute alimentée par le script Python d'ingestion (Parquet déposé dans
      Cloud Storage puis chargé dans BigQuery). Toutes les colonnes métier sont en
      STRING, telles que publiées par l'Assurance Maladie.
    database: "{{ env_var('GCP_PROJECT_ID') }}"
    schema: damir_raw
    tables:
      - name: prestations
        description: >
          Open DAMIR, base complète interrégimes : une ligne par combinaison
          d'axes d'analyse (prestation, bénéficiaire, professionnel...) et par mois
          de traitement. Table partitionnée par mois (_flx_month) et clusterisée
          par PRS_NAT et BEN_RES_REG.
        config:
          loaded_at_field: _ingested_at
          freshness:
            warn_after: {count: 45, period: day}
        columns:
          - name: _flx_month
            description: Mois de traitement (1er jour du mois), clé de partition.
            data_tests:
              - not_null
          - name: PRS_NAT
            description: Nature de prestation (code de la nomenclature PRS_NAT).
          - name: PRS_PAI_MNT
            description: Montant de la dépense (texte brut).
          - name: PRS_REM_MNT
            description: Montant remboursé par l'Assurance Maladie (texte brut).
