# Aucun secret ici : tout passe par des variables d'environnement.
# - dev     : authentification de votre compte Google (gcloud auth application-default login)
# - airflow : clé de compte de service montée dans le conteneur
# - ci      : clé de compte de service écrite par GitHub Actions
open_damir:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: damir
      location: "{{ env_var('BQ_LOCATION', 'EU') }}"
      threads: 4
      job_execution_timeout_seconds: 600
      maximum_bytes_billed: 20000000000  # garde-fou : 20 Go max par requête
    airflow:
      type: bigquery
      method: service-account
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: damir
      location: "{{ env_var('BQ_LOCATION', 'EU') }}"
      threads: 4
      job_execution_timeout_seconds: 900
      maximum_bytes_billed: 20000000000
    ci:
      type: bigquery
      method: service-account
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: damir
      location: "{{ env_var('BQ_LOCATION', 'EU') }}"
      threads: 4
      job_execution_timeout_seconds: 600
      maximum_bytes_billed: 20000000000
